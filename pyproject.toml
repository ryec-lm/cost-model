[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbs-cost-model"
version = "0.1.0"
description = "CLI for building a first-principles cost model organized as a Product Breakdown Structure (PBS)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.scripts]
pbs-cost-model = "pbs_cost_model.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["pbs_cost_model"]
