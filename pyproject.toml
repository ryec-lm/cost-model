[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbs-cost-model"
version = "0.1.0"
description = "First-principles PBS cost model CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "textual>=0.60",
]

[project.scripts]
pbs = "pbs_cost_model.cli:main"

[tool.setuptools.packages.find]
include = ["pbs_cost_model*"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
